name: Generate Blog Post
on:
  schedule:
    - cron: '0 9 * * 1'
  workflow_dispatch:
    inputs:
      feedback_slug:
        description: 'Slug článku na prepísanie (prázdne = nový článok)'
        required: false
        default: ''
      feedback_text:
        description: 'Feedback / pokyny pre prepísanie článku'
        required: false
        default: ''
jobs:
  generate:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - run: pip install anthropic requests

      - name: Generate and send post
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          BREVO_API_KEY: ${{ secrets.BREVO_API_KEY }}
          APPROVE_SECRET: ${{ secrets.APPROVE_SECRET }}
          AUTHOR_EMAIL: ${{ secrets.AUTHOR_EMAIL }}
          FEEDBACK_SLUG: ${{ inputs.feedback_slug }}
          FEEDBACK_TEXT: ${{ inputs.feedback_text }}
        run: python generate_post.py

      - name: Commit last_post.json
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add last_post.json
          git diff --staged --quiet || git commit -m "Update last_post.json"
          git push
